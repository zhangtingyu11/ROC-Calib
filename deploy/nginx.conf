worker_processes 4;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  # Browser uploads are sent as small resumable chunks, never as one huge body.
  client_max_body_size 20m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    include /tmp/roc-calib-auth.conf;
    listen 3000;
    server_name _;

    location = /api/segment/image {
      proxy_pass http://127.0.0.1:8000/v1/image/segment;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location = /api/segment/health {
      proxy_pass http://127.0.0.1:8000/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /api/calibration/review/ {
      proxy_pass http://127.0.0.1:8000/v1/calibration/review/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 1800s;
      proxy_buffering off;
      gzip off;
    }

    location = /api/calibration/optimize {
      proxy_pass http://127.0.0.1:8000/v1/calibration/optimize;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 1800s;
      proxy_buffering off;
      gzip off;
    }

    location = /api/calibration/lidar-pairs/optimize {
      proxy_pass http://127.0.0.1:8000/v1/calibration/lidar-pairs/optimize;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 1800s;
      proxy_buffering off;
      gzip off;
    }

    location = /api/calibration/lidar-pairs/frame-pairs {
      proxy_pass http://127.0.0.1:8000/v1/calibration/lidar-pairs/frame-pairs;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }

    location = /api/calibration/lidar-pairs/refine {
      proxy_pass http://127.0.0.1:8000/v1/calibration/lidar-pairs/refine;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 1800s;
    }

    location = /api/calibration/lidar-graph/solve {
      proxy_pass http://127.0.0.1:8000/v1/calibration/lidar-graph/solve;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
    }

    location = /api/calibration/demo {
      proxy_pass http://127.0.0.1:8000/v1/calibration/demo;
      proxy_read_timeout 600s;
    }

    location /api/calibration/groups {
      proxy_pass http://127.0.0.1:8000/v1/calibration/groups;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_buffering off;
      gzip off;
    }

    location /api/calibration/bags {
      proxy_pass http://127.0.0.1:8000/v1/calibration/bags;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location /api/calibration/paired {
      proxy_pass http://127.0.0.1:8000/v1/calibration/paired;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location /api/calibration/intrinsics {
      proxy_pass http://127.0.0.1:8000/v1/calibration/intrinsics;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location = /api/calibration/manifest {
      proxy_pass http://127.0.0.1:8000/v1/calibration/manifest;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /data/cache/ {
      proxy_pass http://127.0.0.1:8000/v1/prepared/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }
  }
}
